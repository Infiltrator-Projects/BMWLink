# SPDX-License-Identifier: GPL-3.0-or-later
name: BMWLINK Release
on:
  workflow_run:
    workflows: ["BMWLINK CI"]
    types: [completed]
permissions:
  contents: read

jobs:
  linux:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBMWLINK_BUILD_LINUX_GUI=ON -DBMWLINK_BUILD_PROFILE=generic -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Package GUI DEB
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release cpack
          cpack --config build-linux/CPackConfig.cmake -G DEB -B cpack
          src="$(find cpack -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$src"
          dpkg-deb -c "$src" | grep -F './usr/bin/bmwlink' >/dev/null
          dpkg-deb -c "$src" | grep -F './usr/share/applications/bmwlink.desktop' >/dev/null
          install -m 0644 "$src" "release/BMWLINK-$VERSION-linux-amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BMWLINK-linux
          path: release/*

  windows:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - id: version
        shell: pwsh
        run: '"version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - run: cmake -S . -B build-win32 -A Win32 -DBMWLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-win32 --config Release --target bmwlink-discover --parallel
      - name: Prove and stage EXE
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/bmwlink-discover.exe' -ExpectedTitle 'BMWLINK Discover'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'build-win32/Release/bmwlink-discover.exe' "release/BMWLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BMWLINK-windows
          path: release/*

  iphone:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build unsigned IPA
        run: bash scripts/build-ios-ipa.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BMWLINK-iphone
          path: ${{ runner.temp }}/release/*

  publish:
    name: Publish complete GUI release
    needs: [linux, windows, iphone]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: BMWLINK-*
          path: release
          merge-multiple: true
      - name: Verify GUI artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/BMWLINK-$VERSION-linux-amd64.deb"
          test -s "release/BMWLINK-$VERSION-windows-discover.exe"
          test -s "release/BMWLINK-$VERSION-unsigned.ipa"
          test "$(dpkg-deb -f "release/BMWLINK-$VERSION-linux-amd64.deb" Package)" = bmwlink
          test "$(dpkg-deb -f "release/BMWLINK-$VERSION-linux-amd64.deb" Version)" = "$VERSION"
          (cd release && sha256sum BMWLINK-* > SHA256SUMS.txt)
          tag="v$VERSION"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; releases are immutable" >&2
            exit 1
          fi
          gh release create "$tag" --target "$EXPECTED_SHA" --title "BMWLINK $VERSION" \
            --notes "BMWLINK $VERSION replaces the CLI skeleton with real GUI applications on Linux, Windows and iPhone, all using the shared LINK standards diagnostic core." \
            release/*

      - name: Record pull-based APT publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Central APT publication is pull-based."
          echo "Infiltrator-Repository will discover this immutable GitHub release on its own schedule."
